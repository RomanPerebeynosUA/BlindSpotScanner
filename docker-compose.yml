services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/BlindSpotScanner.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      GitHub__Token: ${GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Llm__WorkspaceId: ${ANTHROPIC_WORKSPACE_ID:-}
      Jira__BaseUrl: ${JIRA_BASE_URL:-}
      Jira__Email: ${JIRA_EMAIL:-}
      Jira__ApiToken: ${JIRA_API_TOKEN:-}
      Jira__ProjectKey: ${JIRA_PROJECT_KEY:-}
      App__PublicUrl: ${APP_PUBLIC_URL:-http://localhost:8080}
      Features__PullRequests: ${FEATURES_PULL_REQUESTS:-true}
      Auth__Mode: ${AUTH_MODE:-Local}
      Auth__Authority: ${AUTH_AUTHORITY:-}
      Auth__ClientId: ${AUTH_CLIENT_ID:-}
      Auth__ClientSecret: ${AUTH_CLIENT_SECRET:-}
      Auth__RoleClaim: ${AUTH_ROLE_CLAIM:-roles}
      Auth__DefaultRole: ${AUTH_DEFAULT_ROLE:-Viewer}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/BlindSpotScanner.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      GitHub__Token: ${GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Llm__WorkspaceId: ${ANTHROPIC_WORKSPACE_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: src/web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  pgdata:
