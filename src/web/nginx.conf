server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve "api" through Docker's DNS, so a recreated api container (new IP)
    # doesn't leave nginx proxying to a stale address.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An AI profile draft or fix can make several LLM calls in one request (D29); nginx's 60 s
        # default would answer 504 while the api is still working.
        proxy_read_timeout 180s;
    }

    # SignalR (from M6) needs the WebSocket upgrade headers.
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
