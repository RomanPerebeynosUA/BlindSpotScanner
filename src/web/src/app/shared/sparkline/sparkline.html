@if (last(); as dot) {
  <svg class="spark" role="img" [attr.width]="width" [attr.height]="height" [attr.viewBox]="'0 0 ' + width + ' ' + height" [attr.aria-label]="ariaLabel()">
    @for (segment of lines(); track $index) {
      <path class="area" [attr.d]="segment.area" fill="var(--accent-soft)" />
      <path class="line" [attr.d]="segment.line" fill="none" stroke="var(--accent)" stroke-width="2" />
    }
    @for (point of isolated(); track $index) {
      <circle class="isolated" [attr.cx]="point.x" [attr.cy]="point.y" r="2.4" fill="var(--accent)" />
    }
    <circle [attr.cx]="dot.x" [attr.cy]="dot.y" r="3.2" fill="var(--accent)" />
  </svg>
}
